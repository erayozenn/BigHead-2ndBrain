<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Your_2ndBRAIN</title>
  <desc id="desc">A second brain for Claude Code and Obsidian: your sources in, a linked and cited wiki out.</desc>
  <style>
    svg { --bg:#FBFAF7; --line:#E4E1DA; --ink:#1F2328; --muted:#656D76; --raw:#B45309; --wiki:#0F766E; --syn:#7C3AED; --edge:#CFCBC2; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0F141A; --line:#30363D; --ink:#E6EDF3; --muted:#8B949E; --raw:#F0A35E; --wiki:#3FB8A8; --syn:#B392F0; --edge:#3A424C; }
    }
    .bg { fill:var(--bg); stroke:var(--line); }
    .sans { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    .mono { font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .ink { fill:var(--ink); } .muted { fill:var(--muted); } .acc { fill:var(--wiki); }
    .pill { fill:none; stroke:var(--ink); stroke-width:1.2; }
    .edge { stroke:var(--edge); stroke-width:1.6; }
    .n-raw { fill:var(--raw); } .n-wiki { fill:var(--wiki); } .n-syn { fill:var(--syn); }
    .halo { fill:var(--bg); }
    .lbl { stroke:var(--bg); stroke-width:5; stroke-linejoin:round; paint-order:stroke; }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="1199" height="299" rx="16"/>

  <text class="sans acc" x="64" y="84" font-size="13" font-weight="700" letter-spacing="2.5">CLAUDE CODE + OBSIDIAN</text>
  <text class="sans ink" x="62" y="140" font-size="50" font-weight="700">Your_2ndBRAIN</text>
  <text class="sans ink" x="64" y="182" font-size="20">Your sources in. A linked, cited wiki out.</text>
  <text class="sans muted" x="64" y="210" font-size="15">Built on Andrej Karpathy's LLM Wiki pattern.</text>

  <g class="sans" font-size="13" font-weight="600">
    <rect class="pill" x="64" y="236" width="178" height="30" rx="15"/>
    <text class="ink" x="153" y="256" text-anchor="middle">Compiled, not chatted</text>
    <rect class="pill" x="254" y="236" width="150" height="30" rx="15"/>
    <text class="ink" x="329" y="256" text-anchor="middle">Every claim cited</text>
    <rect class="pill" x="416" y="236" width="136" height="30" rx="15"/>
    <text class="ink" x="484" y="256" text-anchor="middle">Plain Markdown</text>
  </g>

  <!-- link graph -->
  <g>
    <line class="edge" x1="745" y1="95"  x2="890" y2="75"/>
    <line class="edge" x1="745" y1="95"  x2="915" y2="165"/>
    <line class="edge" x1="770" y1="215" x2="915" y2="165"/>
    <line class="edge" x1="890" y1="75"  x2="915" y2="165"/>
    <line class="edge" x1="890" y1="75"  x2="1065" y2="90"/>
    <line class="edge" x1="915" y1="165" x2="1065" y2="90"/>
    <line class="edge" x1="915" y1="165" x2="1060" y2="215"/>
    <line class="edge" x1="1065" y1="90" x2="1060" y2="215"/>
    <line class="edge" x1="770" y1="215" x2="1060" y2="215"/>
  </g>
  <g>
    <circle class="halo" cx="745" cy="95" r="11"/><circle class="n-raw" cx="745" cy="95" r="7"/>
    <circle class="halo" cx="770" cy="215" r="11"/><circle class="n-raw" cx="770" cy="215" r="7"/>
    <circle class="halo" cx="890" cy="75" r="12"/><circle class="n-wiki" cx="890" cy="75" r="8"/>
    <circle class="halo" cx="915" cy="165" r="15"/><circle class="n-wiki" cx="915" cy="165" r="11"/>
    <circle class="halo" cx="1065" cy="90" r="12"/><circle class="n-wiki" cx="1065" cy="90" r="8"/>
    <circle class="halo" cx="1060" cy="215" r="12"/><circle class="n-syn" cx="1060" cy="215" r="8"/>
  </g>
  <g class="mono muted lbl" font-size="12" text-anchor="middle">
    <text x="745" y="122">src-paper</text>
    <text x="770" y="242">src-lecture</text>
    <text x="890" y="52">spacing-effect</text>
    <text x="915" y="198">retrieval-practice</text>
    <text x="1065" y="67">memory-models</text>
    <text x="1060" y="242">study-plan</text>
  </g>

  <g class="sans muted" font-size="12">
    <circle class="n-raw" cx="806" cy="276" r="5"/><text x="816" y="280">source</text>
    <circle class="n-wiki" cx="882" cy="276" r="5"/><text x="892" y="280">concept</text>
    <circle class="n-syn" cx="964" cy="276" r="5"/><text x="974" y="280">synthesis</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of a wiki page</title>
  <desc id="desc">An example wiki page with frontmatter, a summary for future agents, claims that cite sources, a dated fact, a disputed claim with both sides cited, and a provisional marker.</desc>
  <style>
    svg { --bg:#FBFAF7; --card:#FFFFFF; --line:#E4E1DA; --ink:#1F2328; --muted:#656D76; --wiki:#0F766E; --raw:#B45309; --syn:#7C3AED; --call:#EEF6F4; --tab:#F3F1EC; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0F141A; --card:#161B22; --line:#30363D; --ink:#E6EDF3; --muted:#8B949E; --wiki:#3FB8A8; --raw:#F0A35E; --syn:#B392F0; --call:#13282A; --tab:#1C232C; }
    }
    .bg { fill:var(--bg); stroke:var(--line); }
    .card { fill:var(--card); stroke:var(--line); stroke-width:1.2; }
    .tab { fill:var(--tab); }
    .call { fill:var(--call); } .callbar { fill:var(--wiki); }
    .sans { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    .mono { font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .ink { fill:var(--ink); } .muted { fill:var(--muted); }
    .link { fill:var(--wiki); } .date { fill:var(--raw); } .mark { fill:var(--syn); font-style:italic; }
    .badge { fill:var(--ink); } .badge-t { fill:var(--bg); }
    .rule { stroke:var(--line); }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="1199" height="599" rx="16"/>

  <!-- page mock -->
  <rect class="card" x="40" y="40" width="640" height="520" rx="12"/>
  <path class="tab" d="M40,52 a12,12 0 0 1 12,-12 h616 a12,12 0 0 1 12,12 v28 h-640 z"/>
  <line class="rule" x1="40" y1="80" x2="680" y2="80"/>
  <text class="mono muted" x="64" y="65" font-size="13">wiki/concepts/retrieval-practice.md</text>

  <g class="mono" font-size="14">
    <text class="muted" x="64" y="112">---</text>
    <text class="ink" x="64" y="134">type: <tspan class="muted">concept</tspan></text>
    <text class="ink" x="64" y="156">status: <tspan class="muted">active</tspan></text>
    <text class="ink" x="64" y="178">updated: <tspan class="muted">2026-05-14</tspan></text>
    <text class="ink" x="64" y="200">sources: <tspan class="link">["[[raw/paper.pdf]]"]</tspan></text>
    <text class="ink" x="64" y="222">aliases: <tspan class="muted">[geri çağırma pratiği]</tspan></text>
    <text class="muted" x="64" y="244">---</text>
  </g>

  <rect class="call" x="64" y="262" width="580" height="74" rx="6"/>
  <rect class="callbar" x="64" y="262" width="4" height="74" rx="2"/>
  <g class="mono" font-size="13">
    <text class="link" x="80" y="284" font-weight="700">[!summary]- For future agent</text>
    <text class="ink" x="80" y="305">What: retrieval practice vs. rereading.</text>
    <text class="ink" x="80" y="325">Why kept: core study method. Goes stale: never.</text>
  </g>

  <text class="sans ink" x="64" y="378" font-size="22" font-weight="700">Retrieval practice</text>

  <g class="sans ink" font-size="15">
    <text x="64" y="414">Self-testing beats rereading for long-term recall</text>
    <text x="64" y="436"><tspan class="link">[[src-paper]]</tspan>.</text>
    <text x="64" y="468"><tspan class="date" font-weight="700">2026-05:</tspan> the course exam is open-book <tspan class="link">[[raw/syllabus.pdf]]</tspan>.</text>
    <text x="64" y="500">Gains on complex material are <tspan class="mark">(disputed)</tspan>:</text>
    <text x="64" y="522"><tspan class="link">[[src-study-a]]</tspan> vs. <tspan class="link">[[src-study-b]]</tspan>.</text>
    <text x="64" y="546">The gain grows with delay <tspan class="mark">(provisional)</tspan>.</text>
  </g>

  <!-- badges on the page -->
  <g class="sans" font-size="12" font-weight="700" text-anchor="middle">
    <circle class="badge" cx="652" cy="174" r="11"/><text class="badge-t" x="652" y="178">1</text>
    <circle class="badge" cx="652" cy="299" r="11"/><text class="badge-t" x="652" y="303">2</text>
    <circle class="badge" cx="652" cy="425" r="11"/><text class="badge-t" x="652" y="429">3</text>
    <circle class="badge" cx="652" cy="463" r="11"/><text class="badge-t" x="652" y="467">4</text>
    <circle class="badge" cx="652" cy="511" r="11"/><text class="badge-t" x="652" y="515">5</text>
    <circle class="badge" cx="652" cy="541" r="11"/><text class="badge-t" x="652" y="545">6</text>
  </g>

  <!-- annotations -->
  <text class="sans link" x="728" y="66" font-size="13" font-weight="700" letter-spacing="2.5">HONEST BY DESIGN</text>
  <g class="sans">
    <circle class="badge" cx="740" cy="104" r="11"/><text class="badge-t" x="740" y="108" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <text class="ink" x="764" y="109" font-size="16" font-weight="700">Frontmatter on every page</text>
    <text class="muted" x="764" y="131" font-size="13">Type, status, dates and sources. Search terms in</text>
    <text class="muted" x="764" y="149" font-size="13">your own language go in aliases.</text>

    <circle class="badge" cx="740" cy="186" r="11"/><text class="badge-t" x="740" y="190" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text class="ink" x="764" y="191" font-size="16" font-weight="700">Summary for future agents</text>
    <text class="muted" x="764" y="213" font-size="13">What the page is, why it is kept, and when it</text>
    <text class="muted" x="764" y="231" font-size="13">goes stale.</text>

    <circle class="badge" cx="740" cy="268" r="11"/><text class="badge-t" x="740" y="272" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text class="ink" x="764" y="273" font-size="16" font-weight="700">Every claim cites a source</text>
    <text class="muted" x="764" y="295" font-size="13">A source page or the raw file itself, as a</text>
    <text class="muted" x="764" y="313" font-size="13">wikilink you can click in Obsidian.</text>

    <circle class="badge" cx="740" cy="350" r="11"/><text class="badge-t" x="740" y="354" font-size="12" font-weight="700" text-anchor="middle">4</text>
    <text class="ink" x="764" y="355" font-size="16" font-weight="700">Facts that change carry a date</text>
    <text class="muted" x="764" y="377" font-size="13">Statements are timeless, dated, or a pointer.</text>
    <text class="muted" x="764" y="395" font-size="13">Undated present tense is not allowed.</text>

    <circle class="badge" cx="740" cy="432" r="11"/><text class="badge-t" x="740" y="436" font-size="12" font-weight="700" text-anchor="middle">5</text>
    <text class="ink" x="764" y="437" font-size="16" font-weight="700">Conflicts stay visible</text>
    <text class="muted" x="764" y="459" font-size="13">Both sides are kept, both are cited, and the</text>
    <text class="muted" x="764" y="477" font-size="13">claim is marked (disputed).</text>

    <circle class="badge" cx="740" cy="514" r="11"/><text class="badge-t" x="740" y="518" font-size="12" font-weight="700" text-anchor="middle">6</text>
    <text class="ink" x="764" y="519" font-size="16" font-weight="700">Uncertainty is marked</text>
    <text class="muted" x="764" y="541" font-size="13">(provisional) when evidence is thin,</text>
    <text class="muted" x="764" y="559" font-size="13">(unsupported) when there is none.</text>
  </g>
</svg>
